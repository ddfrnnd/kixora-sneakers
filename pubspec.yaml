name: fashion_ecommerce
description: "SoleStep Footwear — Aplikasi Pemesanan Sepatu Online — BNSP Junior Mobile Programmer"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # HTTP & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  # Database Lokal
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.2

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # SharedPreferences
  shared_preferences: ^2.3.5

  # GPS & Lokasi
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  permission_handler: ^11.4.0

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Konektivitas
  connectivity_plus: ^6.1.4

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  hugeicons: ^1.1.7
  lottie: ^3.1.3

  # JSON
  json_annotation: ^4.9.0

  # Env
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.8
  firebase_auth: ^5.5.3
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animated/
    - .env
